<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Multi-Jugador Supabase</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
    }
    .option-btn:hover {
      background-color: #e9ecef;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card" id="game-container">
    <h2 id="question-title">Cargando pregunta...</h2>
    <div id="options-container"></div>
    
    <p id="status"></p>
    
    <button id="next" class="btn" disabled onclick="nextQuestion()">Siguiente Pregunta</button>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN CON TUS DATOS REALES DE SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://czxfitmwbwjhureyualf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6ACZ8Hmeg7m6Pqc1H5FM1A_PFa2G7I_";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. VARIABLES DE ESTADO Y JUGADOR
    // ==========================================
    // Genera un ID de jugador único automático por cada navegador/pestaña que se conecte
    let currentPlayerId = localStorage.getItem("tdm_player_id");
    if (!currentPlayerId) {
      currentPlayerId = crypto.randomUUID();
      localStorage.setItem("tdm_player_id", currentPlayerId);
    }

    // ID de sala único para pruebas (UUID estático)
    const currentRoomId = "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"; 
    
    let currentQuestion = 0;
    let selectedAnswer = null;
    let answersSubscription = null;

    // Banco de preguntas de prueba
    const questions = [
      { text: "¿Cuál es tu color favorito?", options: ["Rojo", "Azul", "Verde", "Amarillo"] },
      { text: "¿Qué comida prefieres?", options: ["Pizza", "Hamburguesa", "Sushi", "Tacos"] },
      { text: "¿Qué clima te gusta más?", options: ["Frío", "Cálido", "Templado", "Lluvioso"] }
    ];

    // Convierte el índice numérico de la pregunta en un UUID válido para la columna question_id
    function getQuestionUUID(index) {
      const hex = index.toString(16).padStart(12, '0');
      return `00000000-0000-0000-0000-${hex}`;
    }

    // ==========================================
    // 3. INTERFAZ Y EVENTOS
    // ==========================================
    function renderQuestion() {
      selectedAnswer = null;
      document.getElementById("next").disabled = true;
      document.getElementById("status").textContent = "Selecciona una opción...";

      const q = questions[currentQuestion];
      document.getElementById("question-title").textContent = q.text;

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      // Al cambiar de pregunta, verifica si ya respondieron antes
      checkBothAnswered();
    }

    async function selectOption(index) {
      if (selectedAnswer !== null) return;
      selectedAnswer = index;

      // Bloquear botones locales de opción
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => btn.disabled = true);

      // Guardar respuesta en la base de datos de Supabase
      await saveAnswerToDatabase(index);
    }

    // ==========================================
    // 4. MÉTODOS DE BASE DE DATOS (SUPABASE)
    // ==========================================
    async function saveAnswerToDatabase(ansIndex) {
      const qUUID = getQuestionUUID(currentQuestion);

      const { error } = await supabaseClient
        .from("answers")
        .insert({
          room_id: currentRoomId,
          player_id: currentPlayerId,
          question_id: qUUID,
          original_text: String(ansIndex),
          original_language: "es"
        });

      if (error) {
        console.error("Error al guardar en Supabase:", error);
        document.getElementById("status").textContent = "Error al guardar tu respuesta.";
        return;
      }

      await checkBothAnswered();
    }

    async function checkBothAnswered() {
      const qUUID = getQuestionUUID(currentQuestion);

      const { data: currentAnswers, error } = await supabaseClient
        .from("answers")
        .select("player_id")
        .eq("room_id", currentRoomId)
        .eq("question_id", qUUID);

      if (error) {
        console.error("Error al consultar respuestas:", error);
        return;
      }

      if (currentAnswers && currentAnswers.length >= 2) {
        document.getElementById("next").disabled = false;
        document.getElementById("status").textContent = "¡Ambos han respondido! Haz clic en Siguiente.";
      } else if (selectedAnswer !== null) {
        document.getElementById("status").textContent = "Respuesta enviada. Esperando a tu compañero...";
      }
    }

    function subscribeToAnswers(roomId) {
      if (answersSubscription) {
        supabaseClient.removeChannel(answersSubscription);
      }

      answersSubscription = supabaseClient
        .channel("answers-room-" + roomId)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "answers",
            filter: "room_id=eq." + roomId
          },
          async () => {
            await checkBothAnswered();
          }
        )
        .subscribe();
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        document.getElementById("game-container").innerHTML = "<h2>¡Han completado todas las preguntas!</h2>";
      }
    }

    // Inicializar al cargar la página
    window.onload = () => {
      renderQuestion();
      subscribeToAnswers(currentRoomId);
    };
  </script>
</body>
</html>
